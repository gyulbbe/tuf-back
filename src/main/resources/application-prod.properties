#db
spring.datasource.url=jdbc:oracle:thin:@tufdb_tp?TNS_ADMIN=${secrets.WALLET_PATH}
spring.datasource.username=${secrets.DB_USER}
spring.datasource.password=${secrets.DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jwt.secret=${secrets.JWT_SECRET}

logging.level.root=warn

#jpa
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=false

#ollama (fallback when cloudflare quota exhausted)
spring.ai.ollama.base-url=${secrets.OLLAMA_BASE_URL}
spring.ai.ollama.chat.options.model=${secrets.OLLAMA_MODEL}

#cloudflare workers ai (primary, via AI Gateway)
cloudflare.account-id=${secrets.CLOUDFLARE_ACCOUNT_ID}
cloudflare.api-token=${secrets.CLOUDFLARE_API_TOKEN}
cloudflare.ai-gateway.base-url=${secrets.CLOUDFLARE_AI_GATEWAY_URL}

#kure embedding api
kure.embedding.url=${secrets.KURE_EMBEDDING_URL}

tuf-front.url=${secrets.TUF_FRONT_URL}

# SOOP VOD 오디오 다운로드에 사용할 yt-dlp 실행 파일 경로
# 현재 서버 yt-dlp는 vod.sooplive.co.kr 패턴을 사용하므로, .com 입력은 서버에서 .co.kr로 변환한다.
transcript.yt-dlp-path=/usr/local/bin/yt-dlp

# 오디오 추출/변환에 사용할 ffmpeg 실행 파일 경로
# yt-dlp의 오디오 변환과 whisper.cpp 입력용 wav 변환에 사용한다.
transcript.ffmpeg-path=/usr/bin/ffmpeg

# 음성 인식(STT)에 사용할 whisper.cpp CLI 실행 파일 경로
# 백엔드는 이 실행 파일을 ProcessBuilder로 호출한다.
transcript.whisper-cli-path=/opt/whisper.cpp/build/bin/whisper-cli

# whisper.cpp에서 사용할 ggml 모델 파일 경로
transcript.whisper-model-path=/opt/whisper.cpp/models/ggml-large-v3-turbo.bin

# 인식할 음성 언어. 한국어 해설이면 ko 고정.
transcript.whisper-language=ko

# whisper.cpp 추론 스레드 수. 현재 서버 여유를 고려해 3으로 설정한다.
transcript.whisper-threads=3

# whisper.cpp 프로세스 CPU 우선순위. 값이 클수록 낮은 우선순위이며, Spring Boot 앱을 우선하기 위해 15 사용.
transcript.whisper-nice=15

# SOOP VOD에서 내려받은 오디오와 변환 중간 파일을 임시로 저장하는 작업 폴더
transcript.work-dir=/var/lib/tuf/transcripts/work

# whisper.cpp가 생성한 스크립트 결과 파일(txt 등)을 임시로 저장하는 폴더
transcript.output-dir=/var/lib/tuf/transcripts/output

# 스크립트 추출 작업 중 발생한 외부 명령 로그를 저장하는 폴더
transcript.log-dir=/var/log/tuf/transcripts
