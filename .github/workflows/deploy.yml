name: Deploy to OCI

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1단계: 소스코드 체크아웃
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2단계: JDK 설치
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # 3단계: Gradle 빌드
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 4단계: 빌드된 JAR를 서버로 전송
      - name: Copy JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/app/"
          strip_components: 2

      # 5단계: 서버에 환경변수 파일 생성 + 재시작
      - name: Deploy and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 300s
          envs: WALLET_PATH,DB_USER,DB_PASSWORD,JWT_SECRET,OLLAMA_BASE_URL,OLLAMA_MODEL,KURE_EMBEDDING_URL,TUF_FRONT_URL
          script: |
            # 기존 프로세스 종료
            pkill -f 'java -jar' || true
            sleep 2

            # 환경변수 파일 생성
            cat > /home/ubuntu/app/app.env << ENVFILE
            SECRETS_WALLET_PATH=${WALLET_PATH}
            SECRETS_DB_USER=${DB_USER}
            SECRETS_DB_PASSWORD=${DB_PASSWORD}
            SECRETS_JWT_SECRET=${JWT_SECRET}
            SECRETS_OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
            SECRETS_OLLAMA_MODEL=${OLLAMA_MODEL}
            SECRETS_KURE_EMBEDDING_URL=${KURE_EMBEDDING_URL}
            SECRETS_TUF_FRONT_URL=${TUF_FRONT_URL}
            ENVFILE
            chmod 600 /home/ubuntu/app/app.env

            # 시작 스크립트 생성
            cat > /home/ubuntu/app/start.sh << 'SCRIPT'
            #!/bin/bash
            set -a
            source /home/ubuntu/app/app.env
            set +a
            cd /home/ubuntu/app
            java -jar *.jar --spring.profiles.active=prod > app.log 2>&1
            SCRIPT
            chmod +x /home/ubuntu/app/start.sh

            # 백그라운드 실행 (SSH 세션 종료 후에도 유지)
            sudo systemd-run --scope nohup /home/ubuntu/app/start.sh &
            sleep 3
            echo "deploy complete"
        env:
          WALLET_PATH: ${{ secrets.WALLET_PATH }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          KURE_EMBEDDING_URL: ${{ secrets.KURE_EMBEDDING_URL }}
          TUF_FRONT_URL: ${{ secrets.TUF_FRONT_URL }}
